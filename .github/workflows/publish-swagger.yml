name: Publish Swagger

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      swagger_valid: ${{ steps.validate-swagger.outputs.swagger_valid }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and Run Docker Compose
        run: |
          docker compose -f ${{ github.workspace }}/docker-compose.yml -f ${{ github.workspace }}/docker-compose.local.yml up -d --build

      - name: Generate Swagger JSON
        run: |
          echo "Fetching Swagger JSON..."
          curl --retry 3 --retry-delay 3 --retry-all-errors -o swagger.json http://localhost:8080/docs/json

      - name: Validate Swagger JSON
        id: validate-swagger
        run: |
          if jq empty swagger.json; then
            echo "swagger_valid=true" >> $GITHUB_OUTPUT
          else
            echo "swagger_valid=false" >> $GITHUB_OUTPUT && exit 1
          fi

      - name: Upload Swagger JSON as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swagger-json
          path: swagger.json

      - name: Clean up Docker
        run: docker compose -f ${{ github.workspace }}/docker-compose.yml -f ${{ github.workspace }}/docker-compose.local.yml down

  publish-swagger:
    needs: build
    if: github.repository == 'Stuart0411/citrineos-core' && needs.build.outputs.swagger_valid == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check Pages deploy key
        id: deploy-key
        env:
          DEPLOY_KEY: ${{ secrets.CITRINEOS_GITHUB_IO_DEPLOY_KEY }}
        run: |
          if [[ -n "$DEPLOY_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Pages deploy key is not configured; skipping Swagger publication."
          fi

      - name: Start SSH agent
        if: steps.deploy-key.outputs.available == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CITRINEOS_GITHUB_IO_DEPLOY_KEY }}

      - name: Download Swagger Artifact
        if: steps.deploy-key.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: swagger-json

      - name: Checkout citrineos.github.io
        if: steps.deploy-key.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: Stuart0411/citrineos.github.io
          persist-credentials: false
          path: citrineos.github.io

      - name: Push Swagger JSON
        if: steps.deploy-key.outputs.available == 'true'
        run: |
          cd citrineos.github.io
          git remote set-url origin git@github.com:Stuart0411/citrineos.github.io.git
          git checkout -b swagger-updates || git checkout swagger-updates
          cp ../swagger.json ./docs/assets
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add ./docs/assets/swagger.json
          git commit -m "Update Swagger JSON from PR"
          git push -f origin swagger-updates --verbose
